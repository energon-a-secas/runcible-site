  <text x="64" y="132" fill="#f9f9f9" font-size="42" font-weight="700" letter-spacing="-.4">One source, written twice</text>
  <text x="64" y="168" fill="rgba(255,255,255,.46)" font-size="21">25 sets, 664 items. Neither copy is authored, and the writer compares them.</text>
