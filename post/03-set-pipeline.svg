<text x="988" y="386" fill="#f9f9f9" font-size="24" font-weight="700" text-anchor="middle" opacity="1">25 of 25</text>
<text x="988" y="410" fill="rgba(255,255,255,.46)" font-size="15" font-weight="400" text-anchor="middle" opacity="1">byte for byte</text>
<text x="64" y="640" fill="#f9f9f9" font-size="18" font-weight="400" text-anchor="start" opacity="0.9">The writer reads both files back and throws when they differ, so "the two copies agree" is not a habit anybody has to keep.</text>
<text x="64" y="676" fill="rgba(255,255,255,.34)" font-size="17">Games: pairs 3 · sound 2 · beats 1 · order 19. Counts and the sha256 comparison computed over both trees when this diagram was drawn.</text>
